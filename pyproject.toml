[project]
name = "netology-aiagnt"
version = "0.1.0"
requires-python = ">=3.14.5"
dependencies = [
    "beautifulsoup4",
    "datasketch",
    "pydantic",
    "python-dotenv",
    "pyyaml",
    "qdrant-client",
    "requests",
    "sentence-transformers",
    "tiktoken",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "ty",
    "auto-typing-final",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
fix = true
unsafe-fixes = true
line-length = 120
target-version = "py314"
